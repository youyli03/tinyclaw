# tinyclaw 配置模板
# 复制本文件到 ~/.tinyclaw/config.toml 并填入真实值
# 警告：config.toml 已加入 .gitignore，请勿提交真实密钥

# ── LLM 后端 ──────────────────────────────────────────────────────────────────
# 至少需要配置 daily（日常对话）
# code 和 summarizer 不配置时回退到 daily
#
# 支持两种后端类型：
#
# 1. OpenAI-compatible（显式指定 baseUrl + apiKey）：
#
#   [llm.backends.daily]
#   baseUrl = "https://api.openai.com/v1"
#   apiKey  = "sk-..."
#   model   = "gpt-4o"
#   # maxTokens = 4096    # 可选，默认 4096
#   # timeoutMs = 120000  # 可选，默认 120000ms
#
# 2. GitHub Copilot（自动发现模型和能力参数）：
#
#   [llm.backends.daily]
#   provider    = "copilot"
#   githubToken = "gh_cli"   # "gh_cli"=自动, "env"=$GITHUB_TOKEN, 或直接填 token
#   model       = "auto"     # "auto"=默认模型, 或填具体 model ID（如 "gpt-4o"）
#   # timeoutMs = 120000  # 可选，默认 120000ms
#   # maxContextWindow = 200000  # 可选，手动限制有效 context window（tokens）
#                                # 用于修正模型上报值与实际 prompt 上限不一致的情况
#                                # （通常无需设置，tinyclaw 会自动从 max_prompt_tokens 修正）
#
# Copilot 后端会从 https://api.githubcopilot.com/models 自动获取所有可用模型，
# 并将 max_output_tokens / max_context_window_tokens 等参数一一对应到 tinyclaw 配置。
# model = "auto" 时使用 Copilot 标记的 is_chat_default 模型。

[llm.backends.daily]
baseUrl = "https://api.openai.com/v1"
apiKey  = "sk-..."
model   = "gpt-4o"
# maxTokens = 4096    # 可选，默认 4096
# timeoutMs = 120000  # 可选，默认 120000ms
# ── DeepSeek 系后端的思考档位（可选）─────────────────────────────────────────
# reasoningEffort = "medium"  # none|minimal|low|medium|high|xhigh|max，越高思考越多越贵
#                             # 与 thinkingBudget 互斥；与 disableThinking 同时设置时后者优先
# disableThinking = true      # 彻底关闭思考（发 thinking:{type:"disabled"}）
# 会话里可用 `/think <档位>` 临时覆盖后端默认值（写入 sessions/<sessionId>.toml）
# supportsToolCalls = false  # 可选。对接不支持 OpenAI function calling 的"弱模型"(部分本地/小厂模型)时设为 false,
#                            # 自动改走文本模式工具调用(textMode):模型以 <tool_call>{"name":...,"args":...}</tool_call>
#                            # XML 文本块响应,Agent 正则解析后执行,无需模型原生支持 tools 参数。
#                            # Copilot 后端留空时按模型元数据(capabilities.supports.tool_calls)自动推断。

# ── code 后端（可选）──────────────────────────────────────────────────────────
# 供 /code 斜杠命令的 Code 模式使用，未配置时回退到 daily 后端
# 可配置更擅长代码的模型（如 o3-mini、claude-3-5-sonnet 等）
# [llm.backends.code]
# baseUrl = "https://api.openai.com/v1"
# apiKey  = "sk-..."
# model   = "o3-mini"
# # 使用 Copilot 示例：
# # provider    = "copilot"
# # githubToken = "gh_cli"
# # model       = "gpt-4.1"

# 使用 GitHub Copilot 账号示例（取消注释并删除上方 openai 配置）：
# [llm.backends.daily]
# provider    = "copilot"
# githubToken = "gh_cli"   # 需先运行 `gh auth login`
# model       = "auto"     # 自动选择 Copilot 的默认模型

[llm.backends.summarizer]
baseUrl = "https://api.openai.com/v1"
apiKey  = "sk-..."
model   = "gpt-4o-mini"

# ── 模型别名(可选) ──────────────────────────────────────────────────────────
# QQ 内用 /model <别名> 快捷切换模型,无需输入完整 provider/model-id。
# 与内置别名(src/llm/aliases.ts)合并,此处同名键覆盖内置。
# 用法:/model opus(切 chat)、/model code prime(切 code)、/model list copilot
# [llm.aliases]
# opus = "copilot/claude-opus-4.8"
# prime = "copilot/oswe-vscode-prime"
# mimo = "mimo/mimo-v2.5"
# free = "openrouter/auto-free"

# ── Microsoft MFA ──────────────────────────────────────────────────────────────
# 用于高危操作（exec_shell / delete_file 等）的 number-matching 推送确认
# 注册步骤：
#   1. 访问 https://portal.azure.com → App registrations → New registration
#   2. 平台选 "Mobile and desktop applications"，Redirect URI 填 http://localhost
#   3. 复制 Application (client) ID 和 Directory (tenant) ID 填入下方

[auth.mfa]
tenantId    = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
clientId    = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# timeoutSecs = 60   # 可选，默认 60 秒

# ── Secret 文件权限守卫 ─────────────────────────────────────────────────────────
# 启动加载 secrets.toml / config.toml 时检查文件权限是否过宽(group/other 可读)
[auth.secret_guard]
# enabled   = true    # 启用权限检查(默认 true)
# autoChmod = false   # 过宽时自动 chmod 600(默认 false,仅告警)

# ── Prompt 完整性 / 中转站篡改检测 ──────────────────────────────────────────────
# 检测 system prompt 是否被本地篡改(MEM/SYSTEM 被注入)或被中转站(proxy)暗改,默认全关
[auth.prompt_integrity]
# enabled      = false    # 总开关
# mode         = "warn"   # warn=仅告警 | halt=急停中止本轮 LLM 调用
# baselineHash = false    # 本地 system prompt SHA-256 基线校验(检测 MEM/SYSTEM 被篡改)
# canary       = false    # 中转站 canary 篡改检测(注入 nonce 要求模型回显)
#   说明:canary 只能检测"删/改指令",不能检测"只窃听不改";小模型可能误报,
#         建议仅对中转站 backend 开启,且先用 mode="warn" 观察。

# ── QQ Bot ─────────────────────────────────────────────────────────────────────
# 官方 QQ 开放平台 https://q.qq.com/ 申请机器人后获取

# ── 代码辅助工具 ───────────────────────────────────────────────────────────────
# code_assist 工具由 daily agent 调用，将代码任务委派给独立 AI 执行
# backend 可选：
#   "copilot" — 调用 copilot CLI（需安装）
#   "codex"   — 调用 codex CLI（需安装）
#   "api"     — 直接用 daily LLM API 一次无历史调用

[tools.code_assist]
backend        = "copilot"   # 底层执行方式
# model        = "gpt-5.1"  # 可选，透传 --model 给 CLI（api 模式忽略）
# maxCallsPerRun = 5         # 每次用户消息最多调用次数，0 = 不限制（默认 5）

# Code 模式工具调用轮次上限（默认 0 = 无限制，agent 持续执行直到完成或被中断）
# 若需限制轮次（如节省 token），可设为正整数（如 50）
# maxCodeToolRounds = 0

# Chat/Cron 模式工具调用轮次上限（默认 0 = 无限制）
# 0 = 无限制，推荐用于 cron 任务（无人值守，复杂工作流需完整执行）
# 若需限制轮次（如节省 token），可设为正整数（如 20）
# maxChatToolRounds = 0

# 工具执行结果的最大字符数，超出时自动截断，防止大文件读取或冗长命令输出耗尽 context window
# 0 = 不限制（默认 20000）
# maxToolResultChars = 20000

# http_request 工具的 SSRF 防护:默认拒绝请求私网/环回/云元数据地址
# (127/8、10/8、172.16/12、192.168/16、169.254/16 等),防 prompt 注入访问内网
# [tools.http_request]
# allowPrivateHosts = false   # 设为 true 可放行内网(如访问本地 MCSM/Dashboard)

# 多 bot：每个 bot 一个 `[channels.qqbots.<id>]` 块（id 任意，用作 botId）
# [channels.qqbots.main]
# appId        = "102xxxxx"
# clientSecret = "your-client-secret"

# allowFrom = []                  # 空表示全部用户可私信，非空则白名单
# systemPrompt = ""               # 账户级系统提示词（追加在默认 prompt 后）
# imageServerBaseUrl = ""         # 图床公网地址，如 http://your-ip:18765（发图必填）
# markdownSupport = true          # 是否启用 markdown 消息格式
# imageServerPort = 18765         # 图床本地端口
# streaming = true                # 单聊最终回复走官方 C2C 流式消息（/stream_messages）；
#                                 # 整段只占 1 次被动回复额度，代价是长文本不再自动转图片。
#                                 # 群聊/频道不支持流式，始终走普通发送。
#                                 # 回复里的富媒体标签（<img>/<file> 等）不会被流式承载：
#                                 # 正文走流式、媒体标签剥离后单独走普通发送（否则文件传不出去）。

# ── Agent 行为 ─────────────────────────────────────────────────────────────────
# 工具调用的 __purpose（进度旁白）—— 取代了旧的定时心跳。
#
# 开启后（默认）：
#   · 每个工具的参数 schema 会被注入一个可选字段 __purpose（内置工具与 MCP 工具一视同仁）
#   · LLM 可在关键节点填一句面向用户的短旁白，例如「🔍 正在查你最近三个月的持仓」
#   · 执行工具前该字段会被剥离，工具实现与 MCP server 永远看不到它
#   · 只有"用户确实在等"的那些才展示给他（旧的 120 秒通用"仍在处理中"提示已移除）
#
# [agent]
# toolPurpose       = true   # 是否启用 __purpose 机制（关掉则完全不注入、不展示）
# purposeMaxUnits  = 10     # 长度上限：CJK 按字、连续拉丁串按词计；emoji 不计，超出按图形簇截断
# purposeHoldMs    = 4000   # 工具运行超过该时长才算"用户在等"（快工具静默）；0 = 一开始就展示
# purposeMinGapMs  = 3000   # 两次展示之间的最小间隔
#
# 自动 fork（chat / cron / loop 共用）：ReAct 轮次运行超过该阈值后，把剩余任务交给
# continuation Slave 在后台继续，Master 当前轮直接结束。
# ⚠️ continuation Slave 只继承上下文，**不继承 Master 手上的中间结论**；需要模型自己收尾的
# 复杂任务建议设为 0（关闭），改由模型显式调用 agent_fork。
# autoForkThresholdMs = 120000   # 毫秒；0 = 关闭自动 fork（默认 120000 = 2 分钟）

# ── 重试策略 ───────────────────────────────────────────────────────────────────
# 控制 LLM API 调用（流式 + 非流式）及 Copilot token/模型列表请求的重试行为。
# 所有字段均有默认值，通常无需修改，除非遇到严重的网络不稳定或需要降低 429 重试频率。
#
# [retry]
# maxAttempts         = 3      # 最多重试次数（不含首次尝试），默认 3
# baseDelayMs         = 1000   # 指数退避基准延迟（ms），实际带 ±10% 随机抖动，默认 1000
# retry429            = true   # 429 限流是否重试（等待建议时长后重试），默认 true
# retry5xx            = true   # 5xx 服务端错误是否重试，默认 true
# retryTransport      = true   # 传输层错误（ECONNRESET/socket 断开等）是否重试，默认 true
# retryTimeout        = false  # 请求超时是否重试，默认 false（超时通常意味着请求太大）
# streamIdleTimeoutMs = 60000  # 流式调用 chunk 间最长等待时间（ms），超时则中断并重试；0 = 禁用，默认 60000

# ── 向量记忆 ───────────────────────────────────────────────────────────────────
# embedModel 首次运行自动从 HuggingFace 下载
# 切换模型后需删除 ~/.tinyclaw/memory/index.sqlite 重新索引

[memory]
embedModel     = "hf:Qwen/Qwen3-Embedding-0.6B-GGUF/Qwen3-Embedding-0.6B-Q8_0.gguf"
tokenThreshold = 0.8    # 达到 contextWindow 的 80% 时触发摘要压缩
# contextWindow = 128000  # 可选，默认 128000

# ── 混合搜索（BM25 + 向量语义）─────────────────────────────────────────────────
# hybridSearchEnabled = true   # 开启后同时跑 BM25 和向量搜索再融合（默认 true）
# bm25Weight          = 0.3    # BM25 权重，向量权重 = 1 - bm25Weight（默认 0.3）

# ── 时间衰减（模拟遗忘曲线）──────────────────────────────────────────────────────
# decayHalfLifeDays  = 30      # 记忆权重半衰期（天），0 = 禁用衰减（默认 30）
# evergreenPatterns  = ["MEM.md", "MEMORY.md", "patterns.md"]  # 豁免衰减的文件名

# ── MMR 多样性重排 ─────────────────────────────────────────────────────────────
# mmrEnabled = true   # 去除冗余结果，提高注入 LLM 的记忆信息密度（默认 true）
# mmrLambda  = 0.7    # 相关性 vs 多样性权衡（0=只要多样，1=只看相关；默认 0.7）

# ── 记忆写入安全审查 ────────────────────────────────────────────────────────────
# memorySafetyCheck = true   # 写入记忆前检测提示词注入，发现异常跳过写入（默认 true）

# ── Subagent（agent_fork）上下文继承 ───────────────────────────────────────────
# Slave 每次 fork 都是新 session，继承来的内容在首次请求里缓存全部未命中、按全价计费
# （Master 那边是热的），因此继承量不宜大。预算按**模型上下文窗口的比例**而不是固定字符数，
# 这样在 128k 与 800k 等不同窗口下都自洽。
# slaveContextRatio = 0.05   # 继承预算 = clamp(窗口 × 该比例, 8000, 窗口 − 8000)（默认 0.05）
# slaveContextMode  = "standard"  # 默认继承模式：task-only | minimal | standard | full
#                                 #   task-only = 完全不继承（system prompt 里的 MEM.md 仍在）
#                                 #   minimal   = Master 压缩摘要 + 最近 ≤6 轮
#                                 #   standard  = 摘要 + 预算内尽可能多的近期轮次
#                                 #   full      = 同上但不设轮数上限（仍受预算约束）
# slaveRecall       = true   # Slave 启动时补充召回层：注入 ACTIVE.md + 用 task 做 QMD 语义检索
#                            #   （正常交互会话的检索由 agent.ts 负责；Slave 的自动检索是关闭的，
#                            #    这里补上，把"远期记忆"从"塞进上下文"变成"按需召回"）

# ── 语音识别（faster-whisper 本地 ASR）──────────────────────────────────────
# 收到语音消息时自动转文字，转录结果先发给用户，再带 [语音转文字] 前缀输入 AI。
# 需先安装 Python 依赖：pip install faster-whisper
# 首次运行时模型会自动从 HuggingFace 下载并缓存到 ~/.cache/huggingface/

[voice]
model    = "small"   # 模型大小：tiny / base / small / medium / large-v3
                     # tiny ≈ 39M，small ≈ 244M，large-v3 ≈ 1.5G
                     # 中文推荐 "small" 或 "medium"
language = "zh"      # 语言代码（ISO 639-1），留空则自动检测

# ── Google Gemini Provider ────────────────────────────────────────────────────
# [providers.google]
# apiKey = "AIza..."          # Google AI Studio key
# baseUrl = "https://generativelanguage.googleapis.com/v1beta/openai/"
# maxTokens = 8192

# Vision 后端多模型回退示例:
# [llm.backends.vision]
# model = "google/gemini-2.5-flash"         # 主模型(20 RPD)
# supportsVision = true
# fallbacks = [
#   "google/gemini-2.5-flash-lite-preview-05-20",   # 500 RPD 保底
#   "copilot/oswe-vscode-prime",                    # Copilot 兜底
# ]

# ── 交互等待提醒 ────────────────────────────────────────────────────────────────
# 所有需要用户确认的场景(MFA 确认 / ask_user / plan 审批 / 等待输入)在等待期间自动提醒:
# 超过 remindAfterSecs 未回复则发送简短提示,之后每隔 remindIntervalSecs 提醒一次,
# 最多 maxReminds 次。用户回复或等待超时后自动清理,不刷屏。
[interactive]
# remindAfterSecs = 600    # 首次提醒延迟(秒),0 = 不提醒(默认 600 = 10 分钟)
# remindIntervalSecs = 600 # 提醒间隔(秒,默认 600)
# maxReminds = 3           # 最多提醒次数,0 = 不限(默认 3)

# ── 自指运行权限 ────────────────────────────────────────────────────────────────
# agent 的"自身"就是 ~/.tinyclaw。授权后该 agent 对这里拥有完整访问权(读写删),
# 可用 self_runtime_scan / self_runtime_read / self_runtime_delete 查占用、清理磁盘,
# 通用文件工具也不再对这些路径做越界确认。
#
# 唯一的例外是**密钥**:config.toml / secrets.toml / mcp.toml / env / auth/** /
# *.key / *.pem / 文件名含 token 的文件,无论怎么授权都不可读、不可写、不可删。
# 受保护的还有运行时根目录本身、根下的 .git(配置备份仓库)与 agents 整体。
[selfAccess]
# grantedAgents = ["default"]  # 被授权的 agentId 列表,"*" = 全部(默认 [])
# allowDelete   = true         # false 时 self_runtime_delete 只做 dry-run(默认 true)
# exemptMfa     = true         # 只动运行时目录的调用不再逐次 MFA 确认(默认 true)
# maxReadBytes  = 200000       # self_runtime_read 单次返回上限字节(默认 200000)

# ── 沙箱与权限约束 ──────────────────────────────────────────────────────────────
# 边界层(内核强制):exec_shell 跑进 bubblewrap 挂载命名空间 —— 密钥文件被空文件掩码
#   (沙箱内"不存在"而不是"检查后拒绝"),未绑定目录只读,可断网。
# 策略层:审计流 + 无人值守(cron/loop)工具白名单与 MFA 兜底。
# 方案与取证:tmp/sandbox-permission-design-20260911.md
[sandbox]
# enabled        = false            # 总开关(默认 false = 保持历史行为)
# execShell      = "host"           # "sandbox" = 进 bwrap; "host" = 直接本机执行
# onUnavailable  = "deny"           # bwrap 不可用时:deny 拒绝执行 / host 退回本机
# maskSecrets    = true             # 掩码 config/secrets/mcp.toml、auth/、~/.ssh、*.key …
# readableSecretPaths = []          # 掩码例外：这些路径在沙箱内保持可读（默认空 = 全掩）
#                                   # 例：["~/.tinyclaw/secrets.toml"] —— 供直接读该文件的脚本使用
# network        = "allow"          # "deny" 用于处理不可信内容的任务(同时强制收敛环境变量)
# inheritEnv     = true             # ⚠️ 文件掩码不覆盖环境变量(见 schema 注释)
# extraRwPaths   = []               # 额外可写目录(如技能目录),支持 ~ 前缀

[sandbox.audit]
# enabled     = true               # 审计流:~/.tinyclaw/audit/YYYY-MM.jsonl(0600,追加写)
# maxArgChars = 500                # 单条参数摘要上限

# 路径级"无感提权"(fs_grant):agent 可申请 $HOME 内非密钥路径的写权限(HOME 内默认可写只有自己的 workspace),
# 不打扰用户、带 TTL、写审计;cron/loop 一律拒绝。适合"chat 里想写某个外部目录"。
[sandbox.grant]
# enabled          = true          # 总开关(默认 true)
# ttlSecs          = 3600          # 授权有效期(秒,默认 1 小时)
# allowOutsideHome = false         # 是否允许家目录之外的路径(默认否)

# 无人值守任务的密钥声明(cron/loop 的 job 配置字段):
#   "secrets": ["DEEPSEEK_API_KEY"]  → 沙箱内只暴露这把 key(脚本零改动,未声明=空文件)
#   "writablePaths": ["~/.tinyclaw/data"] → 该任务额外可写的目录

[sandbox.unattended]
# mode        = "allowlist"        # cron/loop 只允许 allowedTools;"all" = 旧行为;"deny" = 更严
# mfaFallback = "deny"             # 无人值守且 MFA 无法送达时:deny 拒绝(默认,推荐)/ allow 放行
# allowedTools = [ "read_file", "exec_shell", ... ]   # 默认见 src/config/schema.ts
#   ⚠️ 两个通道规则不同：声明式步骤（cron/loop 的 steps）里 agent_fork 可用；
#      无人值守的 ReAct 循环里 agent_fork 硬禁止（不受本白名单与 mode=all 影响）。

# 提权通道:沙箱是默认,提权是例外。agent 用 exec_shell({ elevate: true }) 请求在沙箱外执行一次。
# 注意与 [sandbox.grant] 的区别:elevate 作用于"一条命令"(脱离沙箱),fs_grant 作用于"一个路径"(仍在沙箱内)。
[sandbox.elevation]
# enabled            = false     # 总开关(默认 false = 只能跑沙箱内)
# allowedAgents      = []        # 允许提权的 agentId 白名单;"*" = 全部
# e1AutoApprove      = true      # 只读类提权(如 ssh -T、systemctl status)免确认
# tokenTtlSecs       = 120       # 一次性令牌有效期(绑定命令哈希;换命令即失效)
# maxRequestsPer5min = 1         # 同一条命令的提权请求节流(防模型被拒后刷屏)
# allowInCron        = false     # cron/loop 等无人值守场景一律不许提权

# ── Web Dashboard ────────────────────────────────────────────────────────────
# 鉴权:token 只从 POST /__login 的表单体或 Authorization: Bearer 头读取(不再从 URL query,
# 避免进反代日志/浏览器历史);登录后凭 dash_token 会话 cookie(随机 sid,7 天滑动,进程重启失效)。
[web]
# enabled = true                            # 总开关(默认 false)
# port    = 4096                            # 监听端口
# token   = "openssl rand -hex 24 生成"      # 不设置则不鉴权(仅内网可接受)

# 下载页:agent 用 release_file 把文件放进释放目录,用户登录后在「下载」页生成一次性 curl 命令取走。
# 两个区:临时区(flat,按 ttlDays 清理) 与 常驻区(可按子目录归类,永不自动清理)。
# 令牌绑定文件指纹(大小+mtime)、有 TTL 与次数上限、只在内存(重启即失效);每次下载都是一次性令牌。
[web.downloads]
# enabled        = true                        # 默认 false
# dir            = "~/.tinyclaw/downloads"     # 临时区目录
# keepDir        = "~/.tinyclaw/keep"          # 常驻区目录(可用子目录归类,如 工具/打包/)
# linkTtlSecs    = 600                         # 一次性令牌有效期(秒)
# maxUses        = 3                           # 单个令牌最多下载次数(留 curl -C - 续传余量)
# maxFileMb      = 512                         # 单文件体积上限(MB)
# maxTotalMb     = 2048                        # 临时区总占用上限(MB),超过后 release_file 拒绝新文件
# keepMaxTotalMb = 5120                        # 常驻区总占用上限(MB)
# ttlDays        = 7                           # 临时区文件保留天数(0 = 不清理;常驻区不受影响)

# ── 启动健康自检与"改坏自动回退" ────────────────────────────────────────────────
# 服务每次启动成功后会把当前 config.toml 记为"上一份可用版本"(config.toml.lkg)。
# 若配置改坏导致启动后 60s 内崩溃(supervisor 的 quick-fail),或自检发现**确定性**配置错误
# (401/403/404/模型名不存在),就会自动回退到那份可用版本并重启;坏配置留证 config.toml.rejected-<ts>。
# 状态与历史:`tinyclaw config status`;手动自检:`tinyclaw config check`。
[health]
# enabled       = true    # 关掉则既不跑自检也不自动回退(写前校验仍然生效)
# probeLlm      = true    # 启动时发一次极小 LLM 请求验证 key/模型名(收到首个 token 立即中断,约 1 token)
# probeTimeoutMs = 5000   # 探测超时(超时按暂时性故障处理,只告警不回退)

# ── 自我管理工具的按 agent 绑定 ────────────────────────────────────────────────
# 会改运行配置的工具(config_set / config_reload / config_validate 与写 mcp.toml 的 mcp_server_add/
# mcp_server_remove/mcp_server_set_enabled/mcp_reload)默认只给 default agent,其他 agent 连"看得到"都不给;
# 纯开关类的 mcp_list_servers / mcp_enable_server / mcp_disable_server 不受此限。
# 要放开就显式列出(支持 "*" 表示全部;空数组 = 谁都不给)。
[tools.selfManagement]
# agents = ["default"]          # 默认值
# agents = ["default", "onlychat"]

# ── 密钥（secrets.toml）的按 agent 授权 ────────────────────────────────────────
# secrets.toml 里的密钥名是可猜的(DEEPSEEK_API_KEY / GITHUB_TOKEN / QQBOT_* …),而下面这些入口都是
# "按名字取密钥":job_start 的 env 里 ${SECRET:NAME}、job_start(secrets:[...])、exec_shell 的声明式
# secrets、http_request 的 header $NAME。所以默认只允许 default agent 读,其他 agent 一律拒绝
# (拒绝理由会写进审计流)。env_list 也只对授权 agent 显示 secrets.toml 的键名(永不显示值)。
# "*" = 放开给所有 agent;空数组 = 谁都不给(连 default 也不给)。
[secrets]
# agents = ["default"]          # 默认值
# agents = ["default", "onlychat"]
# agents = ["*"]
