# tinyclaw MCP 服务器配置
# 复制到 ~/.tinyclaw/mcp.toml 后编辑使用
# 警告：mcp.toml 已加入 .gitignore，请勿提交含密钥的配置
#
# 改完自检：tinyclaw mcp status          （列出载入结果与诊断；env / headers 只显示键名）
# 改完自动生效：服务监听到 mcp.toml 变更会热重载（内容哈希判断，约 1s），无需重启
#
# 三种改法（等价，都走同一套"写前校验 + 备份 + 原子写"）：
#   1. 手写本文件      2. 让 agent 用 mcp_server_add / mcp_server_remove / mcp_server_set_enabled / mcp_reload
#   3. CLI：tinyclaw mcp add / remove / enable / disable
#
# 密钥不要写明文：env / headers 的值支持 ${SECRET:NAME} 引用（连接时从 ~/.tinyclaw/secrets.toml 读取）
#   env = { MY_API_KEY = "${SECRET:MY_API_KEY}" }

# ── 每个 [servers.NAME] 定义一个 MCP server ───────────────────────────────────
# enabled = false 可快速禁用而不删除配置（默认 true）
# transport = "stdio"（子进程）或 "sse"（HTTP/SSE 远程）

# ── stdio 示例：官方 fetch server（网页内容抓取）────────────────────────────────
# [servers.fetch]
# enabled = true
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-fetch"]

# ── stdio 示例：Playwright 浏览器自动化（截图/点击/表单）───────────────────────
# [servers.playwright]
# enabled = false
# transport = "stdio"
# command = "npx"
# args = ["-y", "@playwright/mcp@latest", "--headless"]
#
# 若需要某工具触发 MFA，在 config.toml 的 auth.mfa.tools 里填写工具全名：
# tools = ["mcp_playwright_browser_navigate", "mcp_playwright_browser_click"]

# ── stdio 示例：文件系统访问（限定目录）──────────────────────────────────────────
# [servers.filesystem]
# enabled = false
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/lyy/workspace"]

# ── stdio 示例：带自定义环境变量────────────────────────────────────────────────
# [servers.my-server]
# enabled = false
# transport = "stdio"
# command = "/usr/local/bin/my-mcp-server"
# args = ["--port", "3001"]
# env = { MY_API_KEY = "${SECRET:MY_API_KEY}", LOG_LEVEL = "info" }  # 密钥走引用，非密钥可明文

# ── sse 示例：远程 HTTP/SSE MCP server ──────────────────────────────────────────
# [servers.remote-api]
# enabled = false
# transport = "sse"
# url = "http://localhost:3000/sse"
# headers = { Authorization = "${SECRET:REMOTE_AUTH}" }   # 整值引用；secrets.toml 里存 "Bearer xxx"
#   ↑ ${SECRET:NAME} 只在"整个值就是引用"时解析（不做字符串插值），所以带前缀的值请整体放进 secret
